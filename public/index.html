<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Expense Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">
  <div class="max-w-3xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold text-slate-800">Expense Tracker</h1>
      <span class="text-sm text-slate-500">Node.js + Express</span>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <p class="text-sm text-slate-500">Total Spent</p>
        <p id="totalSpent" class="text-3xl font-bold text-indigo-600 mt-1">₹0</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <p class="text-sm text-slate-500">Total Transactions</p>
        <p id="totalCount" class="text-3xl font-bold text-slate-800 mt-1">0</p>
      </div>
    </div>

    <!-- Add Expense Form -->
    <form id="expenseForm" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="font-semibold text-slate-700">Add New Expense</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <input
          type="text"
          id="title"
          placeholder="Title (e.g., Lunch)"
          required
          class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <input
          type="number"
          id="amount"
          placeholder="Amount (₹)"
          min="1"
          step="any"
          required
          class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <select
          id="category"
          class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <button
        type="submit"
        class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition"
      >
        + Add Expense
      </button>
    </form>

    <!-- Filter & Expense List -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold text-slate-700">Recent Expenses</h2>
        <select
          id="filterCategory"
          class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          <option value="All">All Categories</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <ul id="expenseList" class="divide-y divide-slate-100"></ul>
      <p id="emptyState" class="text-center text-sm text-slate-400 py-6 hidden">
        No expenses found. Add one above!
      </p>
    </div>
  </div>

  <script>
    const expenseForm = document.getElementById('expenseForm');
    const expenseList = document.getElementById('expenseList');
    const emptyState = document.getElementById('emptyState');
    const filterCategory = document.getElementById('filterCategory');
    const totalSpentEl = document.getElementById('totalSpent');
    const totalCountEl = document.getElementById('totalCount');

    async function loadData() {
      const category = filterCategory.value;
      const [expRes, sumRes] = await Promise.all([
        fetch(`/api/expenses?category=${encodeURIComponent(category)}`),
        fetch('/api/summary'),
      ]);

      const expenses = await expRes.json();
      const summary = await sumRes.json();

      totalSpentEl.textContent = `₹${summary.totalSpent.toLocaleString('en-IN')}`;
      totalCountEl.textContent = summary.count;

      expenseList.innerHTML = '';
      if (expenses.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      expenses.forEach((exp) => {
        const li = document.createElement('li');
        li.className = 'py-3 flex items-center justify-between';
        li.innerHTML = `
          <div>
            <p class="font-medium text-slate-800">${exp.title}</p>
            <p class="text-xs text-slate-500">${exp.category} • ${exp.date}</p>
          </div>
          <div class="flex items-center gap-4">
            <span class="font-semibold text-slate-800">₹${exp.amount.toLocaleString('en-IN')}</span>
            <button
              onclick="deleteExpense('${exp.id}')"
              class="text-xs text-red-500 hover:text-red-700 font-medium"
            >
              Delete
            </button>
          </div>
        `;
        expenseList.appendChild(li);
      });
    }

    expenseForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const amount = document.getElementById('amount').value;
      const category = document.getElementById('category').value;

      await fetch('/api/expenses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, amount, category }),
      });

      expenseForm.reset();
      loadData();
    });

    async function deleteExpense(id) {
      await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
      loadData();
    }

    filterCategory.addEventListener('change', loadData);
    loadData();
  </script>
</body>
</html>
